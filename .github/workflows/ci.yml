name: Continuous Integration

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['main']

jobs:
  test:
    name: Test (${{ matrix.platform }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        platform: [jvm, js]
    steps:

      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup JVM
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Node (Scala.js)
        if: matrix.platform == 'js'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Test (JVM)
        if: matrix.platform == 'jvm'
        run: sbt rootJVM/test

      - name: Test (JS)
        if: matrix.platform == 'js'
        run: sbt rootJS/test

  lint:
    runs-on: ubuntu-22.04
    steps:

      - name: Checkout current branch
        uses: actions/checkout@v4

      - name: Setup JVM
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: sbt

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Setup Node (Scala.js)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # scalafix needs a semanticdb compile, so it is scoped to the JVM/JS
      # aggregators while native CI is disabled. scalafmt is a pure text check,
      # so it stays unscoped and still covers native sources. `lintCheck` in
      # build.sbt is unchanged and still covers every platform locally.
      - name: Check Formatting
        run: sbt 'rootJVM/scalafixAll --check' 'rootJS/scalafixAll --check' scalafmtCheckAll scalafmtSbtCheck
